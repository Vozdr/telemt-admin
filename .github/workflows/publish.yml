name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python and locales
        run: |
          python -m compileall -q app
          python -c 'import json, pathlib; [json.loads(path.read_text(encoding="utf-8")) for path in pathlib.Path("app/locales").glob("*.json")]'
      - name: Test user comments
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: armv7
            platform: linux/arm/v7
            dockerfile: Dockerfile.armv7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set image version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=$(cat app/VERSION)" >> "$GITHUB_ENV"
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=w03zd8rc/telemt-admin,push-by-digest=true,name-canonical=true,push=true
          build-args: TELEMT_ADMIN_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish latest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          images=()
          for digest in /tmp/digests/*; do
            images+=("w03zd8rc/telemt-admin@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag w03zd8rc/telemt-admin:latest "${images[@]}"
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          images=()
          for digest in /tmp/digests/*; do
            images+=("w03zd8rc/telemt-admin@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag "w03zd8rc/telemt-admin:${VERSION#v}" "${images[@]}"
